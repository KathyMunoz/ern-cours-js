<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ern-cours-js</title>
  </head>
  <body>
    <h2>Créer le compte</h2>
        <input type="text" id="nom" placeholder="saisir le nom">
        <button id="bt_create">Créer </button>
    
    <h2>Opérations sur un compte</h2>
    
      <input type="text" id="compte" placeholder="saisir le compte">
      <input type="text" id="montant" placeholder="saisir le montant">
      <button id="crediter">Créditer</button>
      <button id="retirer">Retirer</button>
    <h3>Virement</h3>
    
    <!-- partie ( credit et debit) : -->
    <div>
      <input type="text" id="source" placeholder="compta source">
      <input type="text" id="cible" placeholder="compte cible">
      <input type="text" id="montant_virement" placeholder="montant">
    </div>
    <button id="virement">Virement</button>
    <h3>Messages</h3>
    <p id="message"></p>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
